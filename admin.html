<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Glamur Event Hall</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ============= LOGIN ============= -->
  <div id="loginScreen">
    <a class="admin-logo" href="index.html">GLAMUR <span>·</span></a>
    <div class="admin-sub">Administracija</div>

    <div class="login-box">
      <h2>Prijava</h2>
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="admin@glamur.rs" />
      </div>
      <div class="field">
        <label>Lozinka</label>
        <input type="password" id="loginPassword" />
      </div>
      <button class="btn-login" id="loginBtn">Prijavi se</button>
      <div class="login-error" id="loginError">Pogrešan email ili lozinka.</div>
    </div>
  </div>

  <!-- ============= DASHBOARD ============= -->
  <div id="dashboard">
    <div class="dash-header">
      <a class="admin-logo dash-logo" href="index.html">Glamur <span>·</span> Rezervacije</a>
      <button class="btn-logout" id="logoutBtn">Odjava</button>
    </div>

    <div class="cal-card">
      <div class="cal-nav">
        <button class="cal-arrow" id="calPrev">‹</button>
        <h2 id="calTitle">—</h2>
        <button class="cal-arrow" id="calNext">›</button>
      </div>
      <p class="cal-hint">Kliknite na datum da ga označite kao rezervisan ili slobodan.</p>
      <div class="cal-weekdays" id="calWeekdays"></div>
      <div class="cal-days" id="calDays"></div>
      <div class="cal-legend">
        <span class="legend-item"><span class="dot available"></span>Slobodno</span>
        <span class="legend-item"><span class="dot reserved"></span>Rezervisano</span>
      </div>
    </div>

    <div class="reserved-card">
      <h3 id="reservedListTitle">Rezervisani datumi</h3>
      <ul class="reserved-list" id="reservedList">
        <li><span class="empty-state">Nema rezervisanih datuma.</span></li>
      </ul>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="js/admin.js?v=2"></script>
</body>
</html>
